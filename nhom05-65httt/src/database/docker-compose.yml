services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_training_analytics
    restart: always
    environment:
      POSTGRES_DB: training_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema_postgresql.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed_data_postgresql.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pgdata:
