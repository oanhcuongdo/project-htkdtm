# EduVision BI - Nhóm 03 (65HTTT): chạy cục bộ bằng Docker Compose.
#
# Cách dùng (từ thư mục nhom03-65httt/):
#   1. cp .env.example .env     rồi điền POSTGRES_PASSWORD (không commit .env)
#   2. docker compose up -d --build
#   3. API:  http://localhost:8000/docs      Kiểm tra: http://localhost:8000/health/db
#
# Thứ tự khởi động: postgres (healthy) -> migrate (Alembic, chạy xong rồi thoát) -> api.
# Hiện có: PostgreSQL, Alembic, API FastAPI, và Apache Superset (dịch vụ tùy chọn, profile "bi").
#
# Superset nặng (ảnh khoảng 1,3 GB, cần khoảng 1 GB RAM) nên KHÔNG chạy mặc định. Ai cần dashboard thì:
#   1. Điền thêm các biến SUPERSET_* trong .env (xem .env.example)
#   2. docker compose --profile bi up -d --build        Superset: http://localhost:8088
# Chưa có (bổ sung ở PR riêng): n8n, website (chạy riêng bằng `npm run dev` trong src/frontend).

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduvision}
      POSTGRES_USER: ${POSTGRES_USER:-eduvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong tệp .env (xem .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Chạy migration Alembic (src/database/migrations) rồi thoát. Chạy lại an toàn: bản đã áp dụng được bỏ qua.
  migrate:
    build:
      context: ./src/database
    image: eduvision-migrate:dev
    container_name: eduvision-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduvision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduvision}

  api:
    build:
      context: ./src/backend
    image: eduvision-api:dev
    container_name: eduvision-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduvision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduvision}
      PLATFORMS_FILE: /app/config/platforms.yml
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_ENV: ${APP_ENV:-dev}
      # Đăng nhập JWT (API auth do Hoàng Anh làm). Không có giá trị mặc định cho khóa và mật khẩu;
      # API từ chối khởi động nếu thiếu AUTH_JWT_SECRET khi đã bật router xác thực.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_MINUTES: ${AUTH_TOKEN_MINUTES:-60}
      AUTH_ADMIN_USER: ${AUTH_ADMIN_USER:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_VIEWER_USER: ${AUTH_VIEWER_USER:-viewer}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Apache Superset (dashboard). Chỉ chạy khi bật profile "bi". Chỉ đọc schema dw qua tài khoản superset_ro.
  superset:
    profiles: ["bi"]
    build:
      context: ./src/bi/superset
    image: eduvision-superset:dev
    container_name: eduvision-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Các biến SUPERSET_* không có giá trị mặc định; script khởi tạo báo lỗi rõ nếu thiếu.
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:-}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-eduvision}
      POSTGRES_USER: ${POSTGRES_USER:-eduvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  pgdata:
  superset_home:
