name: Nhom 07 (65HTTT) CI

on:
  push:
    branches:
      - dev
      - nhom07-65httt
      - 'feature/**'
    paths:
      - 'nhom07-65httt/src/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - dev
      - nhom07-65httt
      - main
    paths:
      - 'nhom07-65httt/src/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  python:
    name: CI · Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai, worker]
    defaults:
      run:
        working-directory: nhom07-65httt/src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nhom07-65httt/src/${{ matrix.service }}/requirements*.txt
      - name: Install lint & test dependencies
        run: pip install -r requirements-dev.txt ruff==0.15.14
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: python -m pytest -q

  frontend:
    name: CI · Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom07-65httt/src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nhom07-65httt/src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test:run
      - name: Production build check
        run: npm run build

  compose:
    name: CI · Docker Compose Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nhom07-65httt/src
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose config
        run: docker compose --env-file .env.example config --quiet
